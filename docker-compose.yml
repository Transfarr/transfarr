services:
  transfarr:
    image: ghcr.io/transfarr/transfarr:latest
    build: .
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TRANSFARR_PUBLIC_HOST: "${TRANSFARR_PUBLIC_HOST:-127.0.0.1}"
      TRANSFARR_UMASK: "${TRANSFARR_UMASK:-0022}"
      TRANSFARR_SMB_PORT: "${TRANSFARR_SMB_PORT:-445}"
      TRANSFARR_FTP_PORT: "${TRANSFARR_FTP_PORT:-21}"
      TRANSFARR_FTPS_PORT: "${TRANSFARR_FTPS_PORT:-990}"
      TRANSFARR_PASSIVE_MIN: "${TRANSFARR_PASSIVE_MIN:-50000}"
      TRANSFARR_SFTP_PORT: "${TRANSFARR_SFTP_PORT:-22}"
    volumes:
      - ./volumes/data:/data:rw
      - ./volumes/mnt:/mnt:rw
